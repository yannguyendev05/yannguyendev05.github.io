<!DOCTYPE html> <html lang="vi"> <head> <meta charset="UTF-8"> <title>Extract UID</title> <style> body{font-family:Arial;padding:20px;background:#f5f5f5} textarea{width:100%;height:200px;padding:10px} button{margin-top:10px;padding:10px 20px;cursor:pointer} #result{margin-top:20px;background:#fff;padding:10px;border-radius:6px} </style> </head> <body> <h2>Extract UID Facebook Page</h2> <textarea id="input" placeholder="Dán dữ liệu vào đây..."></textarea> <br> <button onclick="run()">Extract</button> <div id="result"></div> <script> function run(){ let text=document.getElementById("input").value; let matches=[...text.matchAll(/id=(\d+)/g)]; let uids=[...new Set(matches.map(x=>x[1]))]; let out="<ul>"; uids.forEach(u=>out+="<li>"+u+"</li>"); out+="</ul>"; document.getElementById("result").innerHTML=out; } </script> </body> </html>
