<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Like Count Filter</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

.row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    margin:15px 0;
}

textarea{
    width:100%;
    height:250px;
    resize:vertical;
    padding:10px;
}

input[type="number"]{
    width:120px;
    padding:8px;
}

button{
    padding:10px 20px;
    cursor:pointer;
}

.stats{
    display:flex;
    gap:20px;
    margin-bottom:10px;
    font-size:15px;
}

.stats b{
    color:#007bff;
}

label{
    display:flex;
    align-items:center;
    gap:5px;
}
</style>
</head>
<body>

<div class="container">

    <h2>Like Count Filter</h2>

    <h3>Input</h3>

    <div class="stats">
        <div>Input Count: <b id="inputCount">0</b></div>
    </div>

    <textarea
        id="inputData"
        placeholder="page_1_like_500|500&#10;page_2_like_1200|1200">
    </textarea>

    <div class="row">

        <label>
            Min Like:
            <input type="number" id="minLike" value="0">
        </label>

        <label>
            Max Like:
            <input type="number" id="maxLike" value="999999999">
        </label>

        <label>
            <input type="checkbox" id="excludeLike">
            Exclude Like Count
        </label>

        <button onclick="filterData()">Lọc</button>

        <button onclick="copyOutput()">Copy Output</button>

    </div>

    <h3>Export</h3>

    <div class="stats">
        <div>Output Count: <b id="outputCount">0</b></div>
        <div>Filtered Out: <b id="filteredCount">0</b></div>
    </div>

    <textarea id="outputData" readonly></textarea>

</div>

<script>

const inputData = document.getElementById("inputData");

inputData.addEventListener("input", updateInputCount);

function updateInputCount(){

    const count = inputData.value
        .split(/\r?\n/)
        .filter(line => line.trim() !== "")
        .length;

    document.getElementById("inputCount").textContent = count;
}

function filterData(){

    const input = inputData.value.trim();

    const minLike =
        parseInt(document.getElementById("minLike").value) || 0;

    const maxLike =
        parseInt(document.getElementById("maxLike").value) ||
        Number.MAX_SAFE_INTEGER;

    const excludeLike =
        document.getElementById("excludeLike").checked;

    const lines = input.split(/\r?\n/);

    const result = [];

    let inputCount = 0;

    for(const line of lines){

        if(!line.trim()) continue;

        inputCount++;

        const parts = line.split("|");

        if(parts.length < 2) continue;

        const id = parts[0].trim();

        const likeCount =
            parseInt(parts[1].trim());

        if(isNaN(likeCount)) continue;

        if(
            likeCount >= minLike &&
            likeCount <= maxLike
        ){

            if(excludeLike){
                result.push(id);
            }
            else{
                result.push(`${id}|${likeCount}`);
            }
        }
    }

    document.getElementById("outputData").value =
        result.join("\n");

    document.getElementById("outputCount").textContent =
        result.length;

    document.getElementById("filteredCount").textContent =
        inputCount - result.length;
}

function copyOutput(){

    const output =
        document.getElementById("outputData");

    if(!output.value){
        alert("Không có dữ liệu để copy");
        return;
    }

    navigator.clipboard.writeText(output.value);

    alert("Đã copy Output");
}

updateInputCount();

</script>

</body>
</html>
